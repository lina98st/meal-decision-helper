<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Decision Helper</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        .bg-orange {
            background-color: #D2691E;
        }
        .btn-orange {
            background-color: #D2691E;
            border-color: #D2691E;
            color: white;
        }
        .btn-orange:hover {
            background-color: #A0522D;
            border-color: #A0522D;
            color: white;
        }
        .text-orange {
            color: #D2691E;
        }
        .border-orange {
            border-color: #F5DEB3 !important;
        }

        .meal-picture {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
    </style>
</head>
<body>
    <header class="bg-orange text-white text-center py-4">
        <div class="container">
            <h1>Meal Decision Helper</h1>
            <p class="lead">Can't decide what to eat? Let us help!</p>
        </div>
    </header>

    <main class="container my-5">
        <section class="text-center mb-5">
            <h2>Get a Random Meal</h2>
            <button type="button" class="btn btn-orange btn-lg mt-3" onclick="getRandomMeal()">Surprise Me!</button>
        </section>

        <!-- Container for meal cards -->
        <section id="mealContainer" class="row justify-content-center g-4">
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Meal Decision Helper &copy; 2026 | Powered by TheMealDB API</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
// fetches a single random meal and adds it to the top of the container 
 async function getRandomMeal() {
            console.log('Button clicked!');
                     const randomMeal = await fetch(
    "https://www.themealdb.com/api/json/v1/1/random.php"
  ).then((response) => response.json());

  console.log(randomMeal)

    // build ingredients list from up to 20 possible ingredient fields
  let ingredientsList = ''

for (let i = 1; i <= 20; i++) {
    if (randomMeal.meals[0]['strIngredient' + i]) {
ingredientsList += '<li>' + randomMeal.meals[0]['strMeasure' + i] + ' ' + randomMeal.meals[0]['strIngredient' + i] + '</li>'
    }
}

const cardHTML = `
    <div class="col-md-4">
        <div class="card border-orange">
            <h3>${randomMeal.meals[0].strMeal}</h3>
<img
  class="meal-picture"
  src="${randomMeal.meals[0].strMealThumb}"
  alt="Random Meal send by the Meal DB" />
  <ul>${ingredientsList}</ul>
        </div>
    </div>
`;

document.getElementById('mealContainer').insertAdjacentHTML('afterbegin', cardHTML);
        }

// builds and returns the HTML string for a single meal card
        function createCardHTML(meal) {  
  let ingredientsList = ''

for (let i = 1; i <= 20; i++) {
if (meal['strIngredient' + i]) {
ingredientsList += '<li>' + meal['strMeasure' + i] + ' ' + meal['strIngredient' + i] + '</li>'
    }
}

        return `
    <div class="col-md-4">
        <div class="card border-orange">
            <h3>${meal.strMeal}</h3>
<img
  class="meal-picture"
  src="${meal.strMealThumb}"
  alt="Random Meal send by the Meal DB" />
  <ul>${ingredientsList}</ul>
        </div>
    </div>
`;
        }


//fetches 6 random meals on the website
        async function getSixMeals() {

const promises = Array.from({ length: 6 }, () =>
    fetch("https://www.themealdb.com/api/json/v1/1/random.php").then(response => response.json())
);
           const results = await Promise.all(promises);


           document.getElementById('mealContainer').innerHTML = '';

               results.forEach(results => {
        const meal = results.meals[0];
        document.getElementById('mealContainer').insertAdjacentHTML('beforeend', createCardHTML(meal));
    });
        
    }
    
    </script>
</body>
</html>
