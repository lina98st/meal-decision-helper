<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Decision Helper</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        .bg-coral {
            background-color: #FF6B6B;
        }
        .btn-coral {
            background-color: #FF8B94;
            border-color: #FF8B94;
            color: white;
        }
        .btn-coral:hover {
            background-color: #FF6B6B;
            border-color: #FF6B6B;
        }
        .text-coral {
            color: #FF6B6B;
        }
        .border-coral {
            border-color: #FFB3BA !important;
        }
    </style>
</head>
<body>
    <header class="bg-coral text-white text-center py-4">
        <div class="container">
            <h1>Meal Decision Helper</h1>
            <p class="lead">Can't decide what to eat? Let us help!</p>
        </div>
    </header>

    <main class="container my-5">
        <section class="text-center mb-5">
            <h2>Get a Random Meal</h2>
            <button type="button" class="btn btn-coral btn-lg mt-3" onclick="getRandomMeal()">Surprise Me!</button>
        </section>

        <section id="mealDisplay" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card border-coral">
                        <img id="mealImage" src="" class="card-img-top" alt="Meal image" />
                        <div class="card-body">
                            <h3 id="mealName" class="card-title text-coral"></h3>
                            <p id="mealCategory" class="text-muted"></p>
                            
                            <h5 class="mt-4 text-coral">Ingredients</h5>
                            <ul id="ingredientsList"></ul>
                            
                            <h5 class="mt-4 text-coral">Instructions</h5>
                            <p id="mealInstructions"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Meal Decision Helper &copy; 2026 | Powered by TheMealDB API</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function getRandomMeal() {
            console.log('Button clicked!');
        }
    </script>
</body>
</html>
