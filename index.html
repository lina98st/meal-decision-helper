<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Decision Helper</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        .bg-orange {
            background-color: #FF9F43;
        }
        .btn-orange {
            background-color: #FF9F43;
            border-color: #FF9F43;
            color: white;
        }
        .btn-orange:hover {
            background-color: #CC8034;
            border-color: #CC8034;
            color: white;
        }
        .text-orange {
            color: #FF9F43;
        }
        .border-orange {
            border-color: #FFEAA7 !important;
        }

        .meal-picture {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
    </style>
</head>
<body>
    <header class="bg-orange text-white text-center py-4">
        <div class="container">
            <h1>Meal Decision Helper</h1>
            <p class="lead">Can't decide what to eat? Let us help!</p>
        </div>
    </header>

    <main class="container my-5">
        <section class="text-center mb-5">
            <h2>Get a Random Meal</h2>
            <button type="button" class="btn btn-orange btn-lg mt-3" onclick="getRandomMeal()">Surprise Me!</button>
        </section>

        <!-- Container for meal cards -->
        <section id="mealContainer" class="row justify-content-center g-4">
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Meal Decision Helper &copy; 2026 | Powered by TheMealDB API</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>

 async function getRandomMeal() {
            console.log('Button clicked!');
                     const randomMeal = await fetch(
    "https://www.themealdb.com/api/json/v1/1/random.php"
  ).then((response) => response.json());

  console.log(randomMeal)

const cardHTML = `
    <div class="col-md-4">
        <div class="card border-orange">
            <h3>${randomMeal.meals[0].strMeal}</h3>
<img
  class="meal-picture"
  src="${randomMeal.meals[0].strMealThumb}"
  alt="Random Meal send by the Meal DB" />
        </div>
    </div>
`;

document.getElementById('mealContainer').insertAdjacentHTML('afterbegin', cardHTML);
        }
    </script>
</body>
</html>
